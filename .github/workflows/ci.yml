name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --disable-pip-version-check ruff pytest import-linter

      - name: Syntax
        run: python -m compileall -q futures_divergence.py firstproject tests

      - name: Lint
        run: ruff check .

      - name: Architecture
        run: lint-imports

      - name: Tests
        run: python -m pytest -q
